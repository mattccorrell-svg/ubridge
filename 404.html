<!doctype html>

<meta charset="utf-8">
<script>
  /* GitHub Pages shows this page for any missing address, even a nested one (/ubridge/a/b).
     There, resolve the links below from the site's own folder; anywhere else they stay relative. */
  (function () {
    var parts = location.pathname.split("/");
    if (/\.github\.io$/.test(location.hostname) && parts.length > 2) {
      var base = document.createElement("base");
      base.href = "/" + parts[1] + "/";
      document.head.appendChild(base);
    }
  })();
</script>
